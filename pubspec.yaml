name: clipotp
description: "Clipcode — privacy-focused OTP capture and floating overlay."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  theme:
    path: ../theme
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo-1024.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/logo_background-1024.png"
  adaptive_icon_foreground: "assets/icon/logo_foreground-1024.png"
